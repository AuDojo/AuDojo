
# How many parallel processes to handle client requests
worker_processes auto;

events {
    # Per worker process: how many simultaneous connections can be opened
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types; # To let Nginx handle file types like .js and .css
    default_type application/octet-stream; # Prevents nginx from defaulting to test/plain

    server {
        listen 80;
        server_name frontend;

        location / {
            # Directory where React app's static files are stored at (Dockerfile)
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_pass http://backend:5001/api;
            proxy_ssl_session_reuse off;
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;
        }
    }
}
