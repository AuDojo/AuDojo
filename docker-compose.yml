services:
  webapp:
    build: .
    container_name: webapp
    ports:
      - "5001:5001"

  reverse-proxy:
    image: nginx:latest
    container_name: reverse-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/letsencrypt/:rw
    ports:
      - "443:443" # HTTPS
      - "80:80" # HTTP
    depends_on:
      - webapp
    profiles:
      - production # Only starts with `docker compose --profile production up`

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw # Webroot for challenges
      - ./certbot/conf/:/etc/letsencrypt/:rw # Store SSL certificates
    command: certonly --webroot -w /var/www/certbot --keep-until-expiring --email audojo8@gmail.com -d audojo.org --agree-tos # Get SSL certificate for audojo.org (for HTTPS)
    profiles:
      - production
