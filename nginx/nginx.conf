# How many parallel processes to handle client requests
worker_processes auto;

events {
    # Per worker process: how many simultaneous connections can be opened
    worker_connections 1024;
}


http {
    # HTTP
    server {
        listen 80;
        server_name audojo.org www.audojo.org;
        server_tokens off;

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # SSL certificate challenge
        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name audojo.org www.audojo.org;

        server_tokens off;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/audojo.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/audojo.org/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://webapp:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
