name: Build Project

# Trigger workflow on push on every branch
on:
  push:
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  # pull_request:

# Workflow jobs
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Cache .eslintcache
        id: cache
        uses: actions/cache@v4
        env:
          cache-name: cache
        with:
          path: |
            **/.eslintcache
          key: ${{ runner.os }}-eslint-${{ env.cache-name }}-${{ hashFiles('**/.eslintcache') }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ env.cache-name }}-
            ${{ runner.os }}-eslint-
            ${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm lint --cache-location ".eslintcache"
      - name: Check types
        run: pnpm check-types
      - name: Run tests
        run: pnpm test
      - name: Build application
        run: pnpm build
