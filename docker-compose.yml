services:
  audojo:
    build: .
    container_name: audojo
    deploy:
      mode: replicated
      replicas: 3

  reverse-proxy:
    image: nginx:latest
    container_name: reverse-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare # Cloudfare origin cert/key
    ports:
      - "443:443" # HTTPS Port
      - "80:80" # HTTP Port
    depends_on:
      - audojo
    profiles:
      - production # Only starts with `docker compose --profile production up`