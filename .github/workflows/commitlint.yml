name: Lint Commit Messages
on:
  push:
    branches: [main, dev, production]
  pull_request:
    branches: [main, dev, production]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6
