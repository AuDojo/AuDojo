name: Lint Commit Messages
on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6
